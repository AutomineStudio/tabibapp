# Requires repository secret: OPENAI_API_KEY
# Runs once per day (UTC) and commits data/blogArticles.json when a new article is generated.
name: Daily blog article

on:
  schedule:
    # 06:15 UTC ≈ morning Morocco (varies with DST)
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate daily article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/generate-daily-article.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blogArticles.json
          if git diff --staged --quiet; then
            echo "No JSON changes (skipped or already up to date)."
          else
            git commit -m "chore(blog): add daily AI article $(date -u +%Y-%m-%d)"
            git push
          fi
